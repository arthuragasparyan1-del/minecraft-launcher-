name: Build Amethyst IPA

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-amethyst.yml"
      - "overlay/**"
      - "patches/**"

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - name: Check out this repo (our changes)
        uses: actions/checkout@v4

      - name: Check out Amethyst source
        uses: actions/checkout@v4
        with:
          repository: AngelAuraMC/Amethyst-iOS
          path: amethyst
          submodules: recursive

      - name: Select newest stable Xcode
        run: |
          XC=$(ls -d /Applications/Xcode_*.app | grep -vi beta | sort -V | tail -1)
          echo "Using $XC"
          sudo xcode-select -s "$XC/Contents/Developer"
          xcodebuild -version

      - name: Install Java 8
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "8"

      - name: Make Java 8 visible to macOS
        run: |
          echo "JAVA_HOME is $JAVA_HOME"
          JDK_DIR="$(dirname "$(dirname "$JAVA_HOME")")"
          sudo mkdir -p /Library/Java/JavaVirtualMachines
          sudo ln -sfn "$JDK_DIR" /Library/Java/JavaVirtualMachines/zulu-8.jdk || true
          /usr/libexec/java_home -V || true
          java -version
          echo "----- Makefile lines around the JDK check -----"
          sed -n '180,205p' amethyst/Makefile

      - name: Install build tools
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: brew install make cmake ldid wget

      - name: Apply our changes
        run: |
          if [ -d overlay ]; then cp -R overlay/. amethyst/; fi
          for p in patches/*.patch; do
            [ -e "$p" ] || continue
            git -C amethyst apply "$GITHUB_WORKSPACE/$p"
          done

      - name: Build
        working-directory: amethyst
        run: |
          set -o pipefail
          export PATH=/opt/homebrew/bin:$PATH
          export SLIMMED=1
          export SDKPATH="$(xcrun --sdk iphoneos --show-sdk-path)"
          gmake -j$(sysctl -n hw.ncpu) dsym package PLATFORM=2 2>&1 | tee "$GITHUB_WORKSPACE/build.log"

      - name: Rename app
        env:
          APP_NAME: Minecraft Launcher
        run: |
          set -e
          mkdir -p renamed
          FILE_PREFIX="${APP_NAME// /}"
          for ipa in amethyst/artifacts/*.ipa; do
            [ -e "$ipa" ] || continue
            work=$(mktemp -d)
            unzip -q "$ipa" -d "$work"
            app=$(ls -d "$work"/Payload/*.app | head -1)
            plist="$app/Info.plist"
            for key in CFBundleDisplayName CFBundleName; do
              /usr/libexec/PlistBuddy -c "Set :$key $APP_NAME" "$plist" 2>/dev/null \
                || /usr/libexec/PlistBuddy -c "Add :$key string $APP_NAME" "$plist"
            done
            (cd "$work" && zip -qry "$GITHUB_WORKSPACE/renamed/$FILE_PREFIX-$(basename "$ipa")" Payload)
            rm -rf "$work"
          done
          ls -lh renamed

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: MinecraftLauncher-ipa
          path: renamed/*.ipa
          if-no-files-found: error
