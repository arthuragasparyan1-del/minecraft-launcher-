name: Build IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Unpack project
        run: unzip -q BetterLauncher.zip

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: BetterLauncher
        run: xcodegen generate

      - name: Build and archive (unsigned)
        working-directory: BetterLauncher
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild archive \
            -project BetterLauncher.xcodeproj \
            -scheme BetterLauncher \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/BetterLauncher.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            | tee build/xcodebuild.log

      - name: Package IPA
        working-directory: BetterLauncher
        run: |
          mkdir -p build/Payload
          cp -R build/BetterLauncher.xcarchive/Products/Applications/BetterLauncher.app build/Payload/
          cd build
          zip -r BetterLauncher.ipa Payload

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: BetterLauncher/build/xcodebuild.log
          if-no-files-found: ignore

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: BetterLauncher-ipa
          path: BetterLauncher/build/BetterLauncher.ipa
